<!doctype html>
<html lang="pt-BR">
<head>

<body class="light">

    <h2 class="section-title">Pagamento confirmado! ✅</h2>

    <a id="whatsappBtn" class="cta alt" href="#" target="_blank" rel="noopener noreferrer" style="margin-top:8px">
      Ativar meu diagnóstico no WhatsApp

  <script src="assets/checkout.js"></script>
